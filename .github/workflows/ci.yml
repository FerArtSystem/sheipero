name: CI

on:
  push:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Testes automatizados
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sheipero-api

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Rodar testes
        run: npx jest

  docker:
    name: Build e teste da imagem Docker
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Construir a imagem
        run: docker build -t sheipero-api:${{ github.sha }} ./sheipero-api

      - name: Subir o contêiner e testar a rota principal
        run: |
          docker run -d --name sheipero-api -p 3000:3000 sheipero-api:${{ github.sha }}
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:3000/; then
              echo
              exit 0
            fi
            sleep 2
          done
          docker logs sheipero-api
          exit 1
